apiVersion: v1
kind: ServiceAccount
metadata:
  name: litmus-admin
  namespace: quizauto
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: litmus-admin-role
rules:
  - apiGroups: ["", "litmuschaos.io", "batch", "apps"]
    resources: ["pods", "jobs", "deployments", "statefulsets", "daemonsets", "replicasets", "pods/log", "events", "chaosengines", "chaosexperiments", "chaosresults"]
    verbs: ["create", "delete", "get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: litmus-admin-binding
subjects:
  - kind: ServiceAccount
    name: litmus-admin
    namespace: quizauto
roleRef:
  kind: ClusterRole
  name: litmus-admin-role
  apiGroup: rbac.authorization.k8s.io